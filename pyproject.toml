[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoa-agent-risk"
version = "0.7.4"
description = "Local-first AI agent inventory and risk scanner: finds agent candidates with evidence, maps capabilities and integrations, and gates newly introduced high-confidence critical risks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ved Upadhyay", email = "iamved05@gmail.com" }]
keywords = ["ai-agents", "security", "static-analysis", "llm", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pathspec>=0.11",
    "tomli>=2.0; python_version < '3.11'",
    # AST layer (Part I). Pure wheels with grammars bundled in the wheel —
    # no grammar is ever downloaded at runtime (local-first invariant).
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-language-pack>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# The stoa.runtime SDK's default JSONL path is stdlib-only and needs no
# extra. The extra adds ed25519 signing for the trace chain (grade
# `ed25519`; the stdlib HMAC grade needs nothing). The OTLP exporter will
# land here too (docs/design/runtime-overlay.md §10).
runtime = ["cryptography>=42", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
# Hallucination DetectR text checkers (docs/design/detectr.md). The core,
# Layer 0 and the ledger need none of these.
hallucination = ["lettucedetect>=0.1.7", "transformers>=4.48.3"]
hallucination-hhem = ["transformers>=4.48.3", "torch>=2.2", "sentencepiece>=0.2"]
hallucination-judge = ["deepeval>=3.0"]

[project.scripts]
stoa = "stoa.cli:main"

[project.entry-points."stoa.detectr.checkers"]
lettucedetect = "stoa.detectr.checkers.lettucedetect:LettuceDetectChecker"
hhem = "stoa.detectr.checkers.hhem:HHEMChecker"
deepeval = "stoa.detectr.checkers.deepeval:DeepEvalJudge"
selfcheck = "stoa.detectr.checkers.selfcheck:SelfCheckStub"

[project.urls]
Homepage = "https://stoa-agent-risk.dev"
Repository = "https://github.com/iamved/stoa-agent-risk"
Issues = "https://github.com/iamved/stoa-agent-risk/issues"
Documentation = "https://github.com/iamved/stoa-agent-risk#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stoa = ["templates/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
