[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoa-engine"
version = "0.1.0"
description = "Stoa Risk Underwriting Engine — converts canonical submission JSON into underwriting evidence packets (PDF/XLSX) with per-answer evidence provenance."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "weasyprint>=61",
    "openpyxl>=3.1",
    "jsonpath-ng>=1.6",
    "jsonschema>=4.21",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdf>=4.0"]

[project.scripts]
stoa-engine = "stoa_engine.cli:main"

[tool.setuptools.packages.find]
include = ["stoa_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
