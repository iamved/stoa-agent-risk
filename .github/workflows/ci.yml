name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  dashboard:
    # Builds the UI once, packs it into the wheel, then proves a machine
    # WITHOUT Node can install that wheel and produce a working dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the dashboard template
        run: scripts/build_dashboard.sh

      - name: Reproducible build check
        run: |
          cp src/stoa/templates/dashboard.html /tmp/first.html
          pnpm --dir ui build
          cmp /tmp/first.html ui/dist/index.html

      - name: UI unit tests and lint
        run: |
          pnpm --dir ui typecheck
          pnpm --dir ui lint
          pnpm --dir ui test

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install the wheel in a clean environment without Node
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "stoa/templates/dashboard.html" in names, names
          PY
          mkdir -p /tmp/out
          env -i PATH=/usr/bin:/bin HOME="$HOME" /tmp/clean/bin/stoa dashboard \
            ui/fixtures/meridian-pay.envelope.json --out /tmp/out/meridian-pay.html
          test -s /tmp/out/meridian-pay.html

      - name: Regenerate fixtures (the large one is not committed)
        run: |
          python -m pip install --quiet -e .
          python ui/fixtures/build.py

      - name: Browser smoke tests over file://
        run: |
          pnpm --dir ui exec playwright install --with-deps chromium
          STOA_BIN=/tmp/clean/bin/stoa pnpm --dir ui test:e2e
