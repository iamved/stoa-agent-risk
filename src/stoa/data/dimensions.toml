# Stoa default dimension taxonomy (Part IV §A). Versioned with the binary.
# Users may replace it via stoa.toml [dimensions] taxonomy = "path".
# Dimension ids are hyphenated; capability/rule ids are Stoa's own (underscored).
#
# v2: grouped under AIUC-1's six standard categories (Data & Privacy, Security,
# Safety, Reliability, Accountability, Society) — see docs/dimensions.md. The
# `group` letter is Stoa's own display grouping, not part of the scoring math;
# `group = ""` (unset) is valid for a custom taxonomy that doesn't use groups.

[taxonomy]
id = "stoa-aiuc-8"
version = "2.0"

[[dimensions]]
id = "mandate-overreach"
name = "Mandate overreach"
definition = "Agent reach exceeding its declared operating scope"
assessability = "strong"
group = "B"

[[dimensions]]
id = "boundary-leakage"
name = "Boundary leakage"
definition = "Sensitive data leaving the trust boundary via model calls or network egress"
assessability = "strong"
group = "A"

[[dimensions]]
id = "unreviewed-high-impact-action"
name = "Unreviewed high-impact action"
definition = "High-impact actions reachable without an observed authorization or approval control"
assessability = "strong"
group = "C"

[[dimensions]]
id = "output-fidelity"
name = "Output fidelity"
definition = "Incorrect or unsafe model output causing downstream harm; correctness itself is a runtime property"
assessability = "partial"
group = "D"

[[dimensions]]
id = "injection-tamper-surface"
name = "Injection & tamper surface"
definition = "Susceptibility surface for prompt injection, poisoning, or supply-chain tampering"
assessability = "partial"
group = "B"

[[dimensions]]
id = "conduct-variability"
name = "Conduct variability"
definition = "Non-deterministic or inconsistent agent behavior"
assessability = "proxy"
group = "D"

[[dimensions]]
id = "dependency-drift"
name = "Dependency drift"
definition = "Model behavior changing over time (upstream swaps, performance decay)"
assessability = "proxy"
group = "D"

[[dimensions]]
id = "control-coverage-gap"
name = "Control coverage gap"
definition = "Absence of observed operating controls: auth, validation, rate limits, observability"
assessability = "partial"
group = "B"

# --- scoring weights (Part IV §A.5) ---------------------------------------
[finding_weights]
critical = 40
high = 25
medium = 12
low = 5
info = 2

[confidence_multipliers]
high = 1.0
medium = 0.6
low = 0.3

[scoring]
capability_weight = 18   # each mapped capability contributes this per dimension
provider_weight = 8      # external provider usage -> dependency-drift
control_credit = 20      # each observed control subtracts this (floor 0)

# --- rule -> dimensions ----------------------------------------------------
[rule_dimensions]
SEC001 = ["boundary-leakage", "control-coverage-gap"]
SEC002 = ["boundary-leakage", "control-coverage-gap"]
SEC003 = ["output-fidelity"]
REL001 = ["control-coverage-gap"]
NET001 = ["boundary-leakage", "dependency-drift"]
NET002 = ["control-coverage-gap"]
CTRL001 = ["unreviewed-high-impact-action", "control-coverage-gap"]
CTRL002 = ["output-fidelity", "injection-tamper-surface", "control-coverage-gap"]
CTRL003 = ["control-coverage-gap"]
CTRL004 = ["control-coverage-gap"]
AI001 = ["injection-tamper-surface"]
AI002 = ["output-fidelity"]
AI003 = ["mandate-overreach", "unreviewed-high-impact-action"]
AI004 = ["boundary-leakage"]
AI006 = ["boundary-leakage"]
AI007 = ["conduct-variability"]
# AI005 is variant-aware (handled in code): floating-alias -> conduct-variability
# + dependency-drift, trust-remote-code/unpinned-artifact -> injection-tamper-surface,
# insecure-endpoint -> dependency-drift.
AI005 = ["injection-tamper-surface", "dependency-drift"]
CTRL005 = ["control-coverage-gap"]
CTRL006 = ["control-coverage-gap", "mandate-overreach"]
CTRL007 = ["control-coverage-gap"]
# Assurance layer contradiction detector: declared-vs-scanned mismatches.
DECL001 = ["unreviewed-high-impact-action", "mandate-overreach"]
DECL002 = ["unreviewed-high-impact-action"]
DECL003 = ["unreviewed-high-impact-action"]
DECL004 = ["boundary-leakage"]
DECL005 = ["control-coverage-gap"]
DECL006 = ["control-coverage-gap"]
DECL007 = ["control-coverage-gap"]

# --- capability -> dimensions (Stoa capability ids) ------------------------
[capability_dimensions]
payment_access = ["mandate-overreach", "unreviewed-high-impact-action"]
database_write = ["mandate-overreach", "unreviewed-high-impact-action"]
email_send = ["mandate-overreach", "unreviewed-high-impact-action"]
messaging = ["mandate-overreach", "unreviewed-high-impact-action"]
shell_execution = ["mandate-overreach", "unreviewed-high-impact-action"]
code_execution = ["mandate-overreach", "unreviewed-high-impact-action"]
filesystem_write = ["mandate-overreach", "unreviewed-high-impact-action"]
source_control = ["mandate-overreach", "unreviewed-high-impact-action"]
cloud_resource_access = ["mandate-overreach", "unreviewed-high-impact-action"]
external_http = ["boundary-leakage"]
vector_search = ["injection-tamper-surface"]
web_search = ["injection-tamper-surface"]
browser_automation = ["injection-tamper-surface"]
filesystem_read = ["injection-tamper-surface"]
# An MCP server exposes tools to agents — a scope/authorization surface.
mcp_tools = ["mandate-overreach", "unreviewed-high-impact-action"]

# --- observed control -> dimensions it credits -----------------------------
[control_dimensions]
approval = ["mandate-overreach", "unreviewed-high-impact-action"]
authentication = ["unreviewed-high-impact-action", "control-coverage-gap"]
validation = ["output-fidelity", "control-coverage-gap"]
rate_limit = ["control-coverage-gap"]
observability = ["control-coverage-gap"]
deterministic_sampling = ["conduct-variability"]
pinned_model = ["dependency-drift"]
