# Applicant identity and measured figures for the AI Risk Insurance
# assessment (dashboard) and `stoa export --underwriting`. Fictional example.

[identity]
company        = "Meridian Pay"
contact_name   = "Priya Natarajan"
contact_title  = "Chief Risk Officer"
contact_email  = "risk@meridian.example"
address        = "88 Harbour Street, Level 12, Sydney NSW 2000"
home_state     = "New South Wales"
model_name     = "Meridian support agent (refunds, fee waivers, account actions)"
model_version  = "2026.9"
deployment     = "Production (customer-facing support, chat and IVR)"
currency       = "USD"

[[performance]]
metric  = "Refund decision accuracy"
value   = "96.8%"
cadence = "Monthly, held-out labeled set"

[[performance]]
metric  = "Duplicate-refund rate"
value   = "0.04%"
cadence = "Weekly"

[[performance]]
metric  = "Escalation rate to human agent"
value   = "11.2%"
cadence = "Weekly"

[[performance]]
metric  = "Decision latency (p95)"
value   = "1.9 s"
cadence = "Continuous"

[[performance]]
metric  = "Human-review override rate"
value   = "2.7%"
cadence = "Monthly"

# Business context for the loss outlook. The scan cannot know these.
[intake]
revenue               = 40000000
sector                = "fintech"
jurisdictions         = ["AU", "US"]
records               = 1500000
regulated             = true
minors                = false
monthly_action_volume = 200000
risk_capacity         = 4000000   # the most the company will carry from one AI failure in a year

[[intake.existing_coverage]]
type         = "cyber"
limit        = 5000000
ai_exclusion = true
