[[policies]]
id = "POL-PAY-001-B8F011"
title = "Approval required above threshold"
scope = { agent = "account-actions" }
trigger = "tool_call"
condition = { all = [{ amount_gt = 500 }, { approval_missing = true }] }
action = "escalate"
fail = "closed"
escalate_to = "console"
evidence = ["amount", "currency", "approval_span_id"]
maps_to = { dimension = "unreviewed-high-impact-action", owasp_llm = "LLM06", eu_ai_act = "Art. 14" }
rationale = "Above the declared per-action limit a person decides, even while the approval-on-every-movement policy is still in observe."
recommended_because = ["economic_authority.max_per_action 500", "DECL001"]
pack = "payments"

[[policies]]
id = "POL-FIN-001-B8F011"
title = "Approval on every money movement"
scope = { agent = "account-actions" }
trigger = "tool_call"
condition = { all = [{ expr = "side_effect == 'payment'" }, { approval_missing = true }] }
action = "block"
fail = "closed"
evidence = ["amount", "currency", "approval_span_id"]
maps_to = { dimension = "unreviewed-high-impact-action", owasp_llm = "LLM06", eu_ai_act = "Art. 14" }
rationale = "Regulated payments: a person on the path for every movement, not only above a threshold."
recommended_because = ["capability payment_access", "AI008", "DECL001", "RT001", "RT002", "RT007", "unreviewed-high-impact-action elevated", "declared autonomy_intent human_approved"]
pack = "fintech-regulated"

[[policies]]
id = "POL-FIN-002-B8F011"
title = "Daily aggregate cap, tight"
scope = { agent = "account-actions" }
trigger = "tool_call"
condition = { window_sum_gt = { field = "amount", window = "24h", value = 25000.0 } }
action = "block"
fail = "closed"
evidence = ["amount", "currency"]
maps_to = { dimension = "mandate-overreach", owasp_llm = "LLM06", eu_ai_act = "Art. 9" }
rationale = "Half the default aggregate until the control history justifies more."
recommended_because = ["capability payment_access", "AI008", "DECL001", "RT001", "RT002", "RT007", "unreviewed-high-impact-action elevated", "aggregate from economic_authority.daily_aggregate 25000"]
pack = "fintech-regulated"

[[policies]]
id = "POL-FIN-003-B8F011"
title = "Personal data never leaves in clear"
scope = { agent = "account-actions" }
trigger = "output"
condition = { classifier = { name = "pii", threshold = 0.3 } }
action = "mask"
fail = "closed"
maps_to = { dimension = "boundary-leakage", owasp_llm = "LLM02", eu_ai_act = "Art. 10" }
rationale = "GLBA and PCI: masking is the floor, not the policy."
recommended_because = ["capability payment_access", "AI008", "DECL001", "RT001", "RT002", "RT007", "unreviewed-high-impact-action elevated"]
pack = "fintech-regulated"

