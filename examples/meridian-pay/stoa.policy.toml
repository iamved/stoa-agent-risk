# Written by stoa policy recommend from the September scan, then edited by hand:
# POL-FIN-002-BC3DB1 lowered to 800 a day and enforced while meridian-support is new;
# POL-PAY-001-B8F011 added so refunds above the declared limit escalate to a person.
# Everything else observes. Validate with: stoa policy validate

version = "stoa-policy/0.1"

[defaults]
mode = "observe"

[[policies]]
id = "POL-BASE-001"
title = "Kill switch"
scope = { agent = "*" }
trigger = "any"
condition = { killswitch = true }
action = "block"
fail = "closed"
maps_to = { dimension = "control-coverage-gap", owasp_llm = "LLM06", eu_ai_act = "Art. 14" }
rationale = "A way to stop an agent without a deploy. CTRL007 looks for one in code; this policy is one."
recommended_because = ["every agent"]
pack = "baseline"
enforce = true

[[policies]]
id = "POL-BASE-002"
title = "Every tool call is logged"
scope = { agent = "*" }
trigger = "tool_call"
condition = { expr = "true" }
action = "log"
fail = "open"
maps_to = { dimension = "control-coverage-gap", owasp_llm = "LLM10", eu_ai_act = "Art. 12" }
rationale = "CTRL004 and DECL005: a record of what the agent did, written by the SDK."
recommended_because = ["every agent"]
pack = "baseline"

[[policies]]
id = "POL-BASE-003"
title = "Only declared tools"
scope = { agent = "*" }
trigger = "tool_call"
condition = { expr = "tool not in agent.declared_tools" }
action = "block"
fail = "open"
maps_to = { dimension = "mandate-overreach", owasp_llm = "LLM06", eu_ai_act = "Art. 9" }
rationale = "The scanned tool inventory is the allow-list; RT006 reports what falls outside it."
recommended_because = ["every agent"]
pack = "baseline"

[[policies]]
id = "POL-DATA-001-224627"
title = "Mask personal data in outputs"
scope = { agent = "meridian-escalation" }
trigger = "output"
condition = { classifier = { name = "pii", threshold = 0.5 } }
action = "mask"
fail = "open"
maps_to = { dimension = "boundary-leakage", owasp_llm = "LLM02", eu_ai_act = "Art. 10" }
rationale = "AI004 and AI006: identifiers in what the agent says leave the boundary."
recommended_because = ["integrations databricks"]
pack = "data"

[[policies]]
id = "POL-DATA-002-224627"
title = "Outside sends only to the allow-list"
scope = { agent = "meridian-escalation" }
trigger = "tool_call"
condition = { all = [{ expr = "side_effect == 'external_send'" }, { field_not_in = { field = "to_domain", values = ["databricks"] } }] }
action = "block"
fail = "open"
evidence = ["to_domain"]
maps_to = { dimension = "boundary-leakage", owasp_llm = "LLM02", eu_ai_act = "Art. 10" }
rationale = "Egress to a destination nobody listed; fill values with the hosts AI006 found."
recommended_because = ["integrations databricks"]
pack = "data"

[[policies]]
id = "POL-DATA-003-224627"
title = "Prompt injection on inputs"
scope = { agent = "meridian-escalation" }
trigger = "input"
condition = { classifier = { name = "prompt_injection", threshold = 0.5 } }
action = "escalate"
fail = "open"
escalate_to = "console"
maps_to = { dimension = "injection-tamper-surface", owasp_llm = "LLM01", eu_ai_act = "Art. 15" }
rationale = "AI001: instruction-override patterns in untrusted text, caught by local heuristics."
recommended_because = ["integrations databricks"]
pack = "data"

