# Declared facts for Sparkwing, cross-checked by the scanner (Assurance
# layer). One entry is deliberately wrong -- portfolio_certifier is declared
# human_approved (a second set of eyes on every badge outcome), but the
# scanner infers unrestricted_autonomous (an unguarded model-output-to-SQL
# write with no approval gate). That's DECL001, on purpose.
#
# project_sandbox is left out of this file entirely, on purpose too: it's a
# real scanned agent with no declaration at all, which is exactly the gap
# DECL006 exists to name.

version = 1

[business]
industries = ["education"]
regulated_activities = ["education_records"]
max_customer_dependency = "high"

[agents."f5336ad99023"]                 # agents/mentor_matcher.py :: agent
name = "mentor_matcher"
owner = "learning-eng@sparkwing.example"
purpose = "Suggests a mentor pairing for staff to confirm"
users = "internal"
production_status = "production"
autonomy_intent = "recommend_only"
data_classes = ["personal"]

[agents."2bbb1a53b942"]                 # agents/portfolio_certifier.py :: agent
name = "portfolio_certifier"
owner = "learning-eng@sparkwing.example"
purpose = "Decides whether a project submission earns a portfolio badge"
users = "customers"
production_status = "production"
autonomy_intent = "human_approved"      # WRONG on purpose -- see header
data_classes = ["personal"]

[agents."48d190c5af6c"]                 # agents/portfolio_certifier.py :: executor
